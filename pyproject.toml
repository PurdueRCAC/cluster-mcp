# The workspace root, and the compat distribution `rcac-mcp`: it installs cluster-mcp and the
# deprecated `rcac-mcp` command, so the install line every existing client config names keeps
# working through the deprecation window. It ships no code; the server is packages/cluster-mcp.
[project]
name = "rcac-mcp"
version = "0.1.5"
description = "Deprecated name of cluster-mcp: installs cluster-mcp and the rcac-mcp command"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["cluster-mcp"]

[project.scripts]
rcac-mcp = "cluster_mcp.core:legacy_main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cluster-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A code-less wheel: its metadata (the cluster-mcp dependency and the script) is the whole point.
bypass-selection = true

[tool.hatch.build.targets.sdist]
# Only the two files the build needs: the workspace's furniture (bin/, spec/, issues/, tests/,
# packages/ and the hidden security lane) never reaches this sdist, and bin/sdist_hygiene.py
# re-checks every built tarball.
only-include = ["pyproject.toml", "README.md"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# The oldest uv this project supports. uv 0.5.14 and later read this field, so 0.5.14 up to 0.12.16
# refuse to sync, lock or run the project, naming 0.12.17; uv 0.5.13 and earlier predate it, warn
# about an unknown field and run.
required-version = ">=0.12.17"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: fast and isolated; no subprocess, no network, no real cluster",
    "integration: drives the installed CLI; run it under bin/sandbox.sh",
]

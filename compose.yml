services:
  proxy:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      - mcp

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cluster-mcp
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-at-least-32-characters-long}
      MCP_BASE_URL: ${MCP_BASE_URL:-https://mcp.rcac.dev:8443}
    command: ["-t", "http", "-H", "0.0.0.0", "-p", "8000", "-a", "jwt"]

# The fact map of readme-front-door (GOAL R4, R5, R6; Review mode).
#
# Every fact README.md and SECURITY.md state at the baseline (`2719b7a`), and the one file that
# states it on the branch. `src` is the baseline lines that state it; `dest` is its home on the
# branch; `phrases` are short pieces of the baseline text that carry the fact. docs-gate.py `facts`
# checks, with backticks and `*` removed, link syntax read as its text and its target, whitespace
# collapsed:
#   - every phrase occurs in its fact's baseline lines (the map quotes the baseline, it invents nothing);
#   - every baseline line but a blank line, a heading, a fence marker or a table delimiter falls in
#     some fact's `src` (every fact is mapped);
#   - every phrase of a fact occurs in its `dest`, all of them inside one level-2 section of it;
#   - an `issues/` dest is linked from a docs page;
#   - every line inside a baseline fence that a fact maps appears, stripped, as a line of its dest
#     (code moves verbatim).
# A phrase matches whole: not inside a longer word or number (`45 s` is not found in `44.45 s`). A
# phrase holding two capitals in a row (`TERM`, `MIT`, `JWT or OIDC`) matches case and all; any other
# phrase ignores case.
# A phrase is kept verbatim on the branch: rewrite around it, never through it. The maintainer reads
# the pages; this map is the net under that read, not a proof that each sentence says the same.


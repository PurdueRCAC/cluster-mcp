[project]
name = "cluster-mcp-slurm"
version = "0.1.5"
description = "Slurm tools for cluster-mcp"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["cluster-mcp"]

# The core finds this member through the entry-point group and loads it at startup.
[project.entry-points."cluster_mcp.capabilities"]
slurm = "cluster_mcp.slurm.capability:CAPABILITY"

[tool.uv.sources]
cluster-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only this member's portion of the cluster_mcp namespace: no cluster_mcp/__init__.py ever ships.
only-include = ["src/cluster_mcp/slurm"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
# The sandbox helper, the design records, the backlog, and the hidden security lane are
# repository furniture, not distribution content. A member sdist is rooted at its own directory,
# so none of them sits inside it today; the list is defence in depth, and the release recipe's
# gate re-checks every built tarball (bin/sdist_hygiene.py).
exclude = [
    "/bin",
    "/.security",
    "/.local",
    "/spec",
    "/issues",
    "/tests/fixtures",
    "/certs",
]
